version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: amazona-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    container_name: amazona-spring-backend
    ports:
      - "5000:5000"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/amazona
      - JWT_SECRET=somethingsecret_must_be_at_least_256_bits_long_for_hmac_sha256
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amazona-react-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
